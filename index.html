<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=check_box,list,schedule,check_circle,add,edit,delete,checklist,save,cancel&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a class="logo" href="/desafio_tecnico_front_todolist/">
          <span class="material-symbols-outlined" aria-hidden="true">
            check_box
          </span>

          <h1>To-Do List</h1>
        </a>
      </div>
    </header>
    <main>
      <div class="container">
        <section class="todo">
          <header class="todo__header">
            <div>
              <h2>Minhas tarefas</h2>
              <p>Organize suas atividades e seja mais produtivo.</p>
            </div>

            <div class="todo__stats">
              <div class="stat total-tasks">
                <span
                  class="material-symbols-outlined stat__icon"
                  aria-hidden="true"
                >
                  list
                </span>
                <strong id="total-tasks" class="stat__count">0</strong>
                <span>Total</span>
              </div>

              <div class="stat pending-tasks">
                <span
                  class="material-symbols-outlined stat__icon"
                  aria-hidden="true"
                >
                  schedule
                </span>
                <strong id="pending-tasks" class="stat__count">0</strong>
                <span>Pendentes</span>
              </div>

              <div class="stat completed-tasks">
                <span
                  class="material-symbols-outlined stat__icon"
                  aria-hidden="true"
                >
                  check_circle
                </span>
                <strong id="completed-tasks" class="stat__count">0</strong>
                <span>Concluídas</span>
              </div>
            </div>
          </header>
          <form class="task-form" id="task-form">
            <div class="task-form__input-wrapper">
              <input
                type="text"
                id="task-input"
                name="task"
                placeholder="O que você precisa fazer?"
                required
              />
            </div>
            <button type="submit" class="task-form__button" id="add-task">
              <span class="material-symbols-outlined" aria-hidden="true">
                add
              </span>
              Adicionar
            </button>
          </form>

          <div class="tasks-wrapper">
            <nav class="task-tabs" aria-label="Filtrar tarefas">
              <button
                type="button"
                class="task-tabs__tab task-tabs__tab--active"
                id="tab-all"
              >
                <span
                  class="material-symbols-outlined stat__icon"
                  aria-hidden="true"
                >
                  list
                </span>
                Todas
              </button>

              <button
                type="button"
                class="task-tabs__tab"
                id="tab-pending"
              >
                <span
                  class="material-symbols-outlined stat__icon"
                  aria-hidden="true"
                >
                  schedule </span
                >Pendentes
              </button>

              <button
                type="button"
                class="task-tabs__tab"
                id="tab-completed"
              >
                <span
                  class="material-symbols-outlined stat__icon"
                  aria-hidden="true"
                >
                  check_circle </span
                >Concluídas
              </button>
            </nav>

            <section class="tasks" aria-label="Lista de tarefas">
              <ul id="task-list">
                <li id="task-template" hidden>
                  <article class="task">
                    <input type="checkbox" class="task__input-check" aria-label="Marcar tarefa como concluída"/>
                    <p type="text" class="task__description" aria-label="Tarefa" contenteditable="false">
                    <div class="task__actions">
                      <button class="task__actions__button save-changes" aria-label="Salvar alteração" hidden>
                        <span class="material-symbols-outlined">save</span>
                      </button>
                      <button class="task__actions__button cancel-changes" aria-label="Cancelar alteração" hidden>
                        <span class="material-symbols-outlined">cancel</span>
                      </button>
                      <button class="task__actions__button edit-task" aria-label="Editar tarefa">
                        <span class="material-symbols-outlined">edit</span>
                      </button>
                      <button class="task__actions__button remove-task" aria-label="Apagar tarefa">
                        <span class="material-symbols-outlined">delete</span>
                      </button>
                    </div>
                  </article>
                </li>
              </ul>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
